<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>注册系统</title>
    <style>
        .IT {
            border: 2px solid blue;
            width: 300px;
            height: 40px;
            padding: 5px;
            margin: 5px 0;
            border-radius: 5px;
            font-size: 16px;
        }
        .sub {
            border: 2px solid blue;
            width: 200px;
            height: 40px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
        }
        .BT {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .form-container {
            border: 1px solid #ccc;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            background-color: white;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        a {
            display: block;
            margin-top: 15px;
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            text-align: left;
        }
    </style>
</head>
<body class="BT">
    <div class="form-container">
        <h1>注册新账号</h1>
        <form action="/register" method="post">
            <label for="username">用户名:</label>
            <input class="IT" type="text" id="username" name="username" placeholder="请输入用户名" required>
            <br>
            <label for="password">密码:</label>
            <input class="IT" type="password" id="password" name="password" placeholder="请输入密码" required>
            <br>
            <input class="sub" type="submit" value="注册">
        </form>
        <br>
        <a href='/login'>返回登录系统</a>
    </div>
</body>
</html>
