<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>包包租赁系统—登录界面</title>
    <style>
        .HT {
            font-family: Arial, sans-serif;
            font-size: 32px;
            color: #002afd;
            font-weight: bold;
            font-style: italic;
            text-decoration: none;
            display: block;
            text-align: center;
            padding: 20px;
        }

        .HT:hover {
            color: #0018a8;
            text-decoration: underline;
        }

        .BT {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .grid-container {
            display: grid;
            grid-template-rows: 200px 200px;
            grid-template-columns: 300px 300px;
            gap: 20px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .grid-item {
            background-color: #ffffff;
            border: 4px solid #1e1f22;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .grid-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .span-two-columns {
            grid-column: span 2;
        }
    </style>
</head>

<body class="BT">
    <div class="grid-container">
        <div class="grid-item span-two-columns">
            <a href="/login" class="HT">登录系统</a>
        </div>
    </div>
</body>

</html>
