<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>包包下架系统</title>
    <style>
        .IT {
            border: 2px solid blue;
            width: 300px;
            height: 40px;
            padding: 5px;
            margin: 5px 0;
            border-radius: 5px;
            font-size: 16px;
        }
        .sub {
            border: 2px solid blue;
            width: 200px;
            height: 40px;
            background-color: #ff4d4d;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
        }
        .BT {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .form-container {
            border: 1px solid #ccc;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            background-color: white;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        a {
            display: block;
            margin-top: 15px;
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body class="BT">
    <div class="form-container">
        <h1>包包下架系统</h1>
        <form action="/Bout" method="post">
            <label for="name">包包品牌:</label>
            <input class="IT" type="text" id="name" name="name" placeholder="输入包包品牌" required>
            <br>
            <label for="number">下架数量:</label>
            <input class="IT" type="number" id="number" name="number" placeholder="输入下架数量" min="1" required>
            <br>
            <input class="sub" type="submit" value="提交下架">
        </form>
        <br>
        <a href='/Bshow'>查看所有包包</a>
        <a href='/internal_management'>返回管理系统</a>
        <a href='/logout'>退出登录</a>
    </div>
</body>
</html>
